---
services:
  3s-ui:
    image: ghcr.io/samur005/3s-ui
    container_name: 3s-ui
    hostname: "3s-ui"
    volumes:
      - "./db:/app/db"
      - "./cert:/root/cert"
    tty: true
    restart: unless-stopped
    ports:
      - "2095:2095"
      - "2096:2096"
      # Uncomment the line below to enable automatic ACME (Let's Encrypt)
      # certificates. It binds host port 80, which must be free.
      # - "80:80"
    networks:
      - 3s-ui
    entrypoint: "./entrypoint.sh"

networks:
  3s-ui:
    driver: bridge
