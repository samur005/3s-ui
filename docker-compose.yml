---
services:
  3s-ui:
    image: ghcr.io/samur005/3s-ui
    container_name: 3s-ui
    hostname: "3s-ui"
    volumes:
      - "./db:/app/db"
      - "./cert:/root/cert"
    tty: true
    restart: unless-stopped
    ports:
      - "2095:2095"
      - "2096:2096"
      # Uncomment the line below to enable automatic ACME (Let's Encrypt)
      # certificates. It binds host port 80, which must be free.
      # - "80:80"
    networks:
      - 3s-ui
    entrypoint: "./entrypoint.sh"
    # qWDTT (VK call tunnel) needs to create network interfaces and routing
    # rules, so it only works with these two settings; the UDP ports it
    # listens on (56000, 56003 by default) then bind on the host directly.
    # Without them the panel works as usual and qWDTT stays unavailable.
    # network_mode: host    # replaces `ports:` and `networks:` above
    # cap_add:
    #   - NET_ADMIN

networks:
  3s-ui:
    driver: bridge
